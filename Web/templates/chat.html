{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Emotion AI Assistant</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2f7,
                    #f8fafc
                );

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #172033;
        }


        /* =====================================================
           MAIN CHAT CONTAINER
        ===================================================== */

        .chat-wrapper {
            width: 100%;

            max-width: 1050px;

            height: 92vh;

            margin: 4vh auto;

            background: #ffffff;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.12);

            display: flex;

            flex-direction: column;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .chat-header {
            background: #20252a;

            color: white;

            padding: 22px 26px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            flex-shrink: 0;
        }

        .assistant-title {
            font-size: 24px;

            font-weight: 700;

            margin-bottom: 4px;
        }

        .assistant-subtitle {
            color: #b9bec5;

            font-size: 14px;

            margin-bottom: 12px;
        }

        .status-row {
            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .online-dot {
            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #20c56a;

            box-shadow:
                0 0 8px
                rgba(32, 197, 106, 0.8);
        }

        .camera-status {
            font-size: 13px;

            color: #bfc5cc;
        }

        .camera-status span {
            color: #ffc107;

            font-weight: 700;
        }


        /* =====================================================
           HEADER RIGHT SIDE
        ===================================================== */

        .header-right {
            display: flex;

            align-items: center;

            gap: 12px;

            flex-shrink: 0;
        }


        /* =====================================================
           NAVIGATION BUTTONS
        ===================================================== */

        .header-nav-buttons {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }

        .header-nav-btn {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 8px 13px;

            border-radius: 8px;

            border: 1px solid #555b61;

            background: #30353a;

            color: #ffffff;

            text-decoration: none;

            font-size: 12px;

            font-weight: 600;

            transition: 0.2s ease;
        }

        .header-nav-btn:hover {
            background: #ffffff;

            color: #20252a;

            border-color: #ffffff;
        }


        /* =====================================================
           EMOTION CARD
        ===================================================== */

        .emotion-card {
            width: 230px;

            background: #30353a;

            border: 1px solid #484e54;

            border-radius: 13px;

            padding: 13px 15px;

            flex-shrink: 0;
        }

        .emotion-label {
            font-size: 11px;

            color: #adb3ba;

            text-transform: uppercase;

            letter-spacing: 0.6px;

            margin-bottom: 7px;
        }

        .emotion-value-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 8px;
        }

        .emotion-value {
            font-size: 16px;

            font-weight: 700;
        }

        .confidence-value {
            font-size: 12px;

            color: #d4d7da;
        }

        .confidence-track {
            height: 5px;

            width: 100%;

            background: #555a5f;

            border-radius: 10px;

            overflow: hidden;
        }

        .confidence-bar {
            height: 100%;

            width: 0%;

            background: #ef4056;

            border-radius: 10px;

            transition: width 0.3s ease;
        }


        /* =====================================================
           CHAT BODY
        ===================================================== */

        .chat-body {
            flex: 1;

            overflow-y: auto;

            padding: 28px;

            background: #f8f9fa;

            scroll-behavior: smooth;
        }


        /* Scrollbar */

        .chat-body::-webkit-scrollbar {
            width: 9px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: #999;

            border-radius: 10px;
        }

        .chat-body::-webkit-scrollbar-thumb:hover {
            background: #777;
        }


        /* =====================================================
           MESSAGE ROW
        ===================================================== */

        .message-row {
            display: flex;

            flex-direction: column;

            margin-bottom: 24px;

            max-width: 82%;
        }

        .message-row.user {
            margin-left: auto;

            align-items: flex-end;
        }

        .message-row.bot {
            margin-right: auto;

            align-items: flex-start;
        }


        /* =====================================================
           MESSAGE LABEL
        ===================================================== */

        .message-label {
            font-size: 11px;

            color: #777;

            margin-bottom: 6px;

            padding: 0 4px;
        }


        /* =====================================================
           MESSAGE BUBBLE
        ===================================================== */

        .message-bubble {
            border-radius: 15px;

            padding: 13px 17px;

            font-size: 15px;

            line-height: 1.65;

            word-break: normal;

            overflow-wrap: anywhere;

            white-space: normal;
        }

        .message-row.user .message-bubble {
            background: #20252a;

            color: white;

            border-bottom-right-radius: 5px;

            max-width: 100%;
        }

        .message-row.bot .message-bubble {
            background: white;

            color: #172033;

            border: 1px solid #e2e6ea;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.04);

            border-bottom-left-radius: 5px;

            max-width: 100%;
        }


        /* =====================================================
           BOT MARKDOWN
        ===================================================== */

        .message-bubble p {
            margin-top: 0;

            margin-bottom: 12px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble strong {
            font-weight: 700;
        }

        .message-bubble ul {
            margin-top: 8px;

            margin-bottom: 12px;

            padding-left: 22px;
        }

        .message-bubble li {
            margin-bottom: 5px;
        }

        .message-bubble h1,
        .message-bubble h2,
        .message-bubble h3 {
            margin-top: 14px;

            margin-bottom: 9px;

            font-weight: 700;
        }

        .message-bubble h1 {
            font-size: 21px;
        }

        .message-bubble h2 {
            font-size: 19px;
        }

        .message-bubble h3 {
            font-size: 17px;
        }


        /* Inline code */

        .message-bubble code.inline-code {
            background: #eef1f4;

            color: #c7254e;

            padding: 2px 6px;

            border-radius: 5px;

            font-size: 13px;

            font-family:
                Consolas,
                "Courier New",
                monospace;
        }


        /* =====================================================
           CODE BLOCK
        ===================================================== */

        .code-wrapper {
            margin: 13px 0;

            background: #1e1e1e;

            border-radius: 11px;

            overflow: hidden;

            border: 1px solid #333;
        }

        .code-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 8px 12px;

            background: #292929;

            color: #bdbdbd;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .copy-code-btn {
            border: none;

            background: #3a3a3a;

            color: #ddd;

            padding: 4px 9px;

            border-radius: 5px;

            font-size: 11px;

            cursor: pointer;
        }

        .copy-code-btn:hover {
            background: #505050;
        }

        .code-wrapper pre {
            margin: 0;

            padding: 15px;

            overflow-x: auto;

            color: #f1f1f1;

            font-size: 13px;

            line-height: 1.6;

            font-family:
                Consolas,
                "Courier New",
                monospace;
        }

        .code-wrapper pre code {
            color: inherit;

            background: transparent;

            padding: 0;
        }


        /* =====================================================
           RESPONSE SOURCE
        ===================================================== */

        .response-source {
            display: inline-block;

            margin-top: 11px;

            padding: 4px 9px;

            border-radius: 12px;

            background: #f1f3f5;

            color: #666;

            font-size: 10px;

            font-weight: 600;

            border: 1px solid #e0e0e0;
        }


        /* =====================================================
           TYPING INDICATOR
        ===================================================== */

        .typing-row {
            display: none;

            align-items: flex-start;

            margin-bottom: 20px;
        }

        .typing-bubble {
            background: white;

            border: 1px solid #e1e5e9;

            border-radius: 15px;

            padding: 12px 16px;
        }

        .typing-dot {
            display: inline-block;

            width: 7px;

            height: 7px;

            margin-right: 4px;

            background: #888;

            border-radius: 50%;

            animation: typing 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;

                transform: translateY(0);
            }

            30% {
                opacity: 1;

                transform: translateY(-3px);
            }
        }


        /* =====================================================
           INPUT AREA
        ===================================================== */

        .chat-input-area {
            padding: 16px 18px;

            background: white;

            border-top: 1px solid #e5e7eb;

            display: flex;

            gap: 10px;

            flex-shrink: 0;
        }

        .message-input {
            flex: 1;

            min-width: 0;

            height: 50px;

            border: 1px solid #aeb4ba;

            border-radius: 13px;

            padding: 0 15px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        .message-input:focus {
            border-color: #20252a;

            box-shadow:
                0 0 0 2px
                rgba(32, 37, 42, 0.08);
        }

        .send-button {
            width: 100px;

            height: 50px;

            border: none;

            border-radius: 12px;

            background: #20252a;

            color: white;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .send-button:hover {
            background: #30363b;
        }

        .send-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =====================================================
           CAMERA
        ===================================================== */

        #cameraVideo {
            display: none;
        }

        #cameraCanvas {
            display: none;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .chat-header {
                align-items: flex-start;
            }

            .header-right {
                flex-direction: column;

                align-items: flex-end;
            }

            .header-nav-buttons {
                justify-content: flex-end;
            }

            .emotion-card {
                width: 210px;
            }

        }


        @media (max-width: 768px) {

            .chat-wrapper {
                width: 100%;

                height: 100vh;

                margin: 0;

                border-radius: 0;
            }

            .chat-header {
                padding: 16px;

                align-items: flex-start;
            }

            .emotion-card {
                width: 185px;
            }

            .assistant-title {
                font-size: 20px;
            }

            .assistant-subtitle {
                font-size: 12px;
            }

            .chat-body {
                padding: 18px;
            }

            .message-row {
                max-width: 92%;
            }

            .chat-input-area {
                padding: 12px;
            }

            .send-button {
                width: 75px;
            }

        }


        @media (max-width: 600px) {

            .chat-header {
                flex-direction: column;
            }

            .header-right {
                width: 100%;

                align-items: stretch;
            }

            .header-nav-buttons {
                justify-content: flex-start;
            }

            .emotion-card {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<script>

    /* ========================================================
       CSRF TOKEN
    ======================================================== */

    function getCookie(name) {

        let cookieValue = null;

        if (
            document.cookie &&
            document.cookie !== ""
        ) {

            const cookies =
                document.cookie.split(";");

            for (
                let cookie of cookies
            ) {

                cookie = cookie.trim();

                if (
                    cookie.substring(
                        0,
                        name.length + 1
                    ) ===
                    (name + "=")
                ) {

                    cookieValue =
                        decodeURIComponent(
                            cookie.substring(
                                name.length + 1
                            )
                        );

                    break;
                }

            }

        }

        return cookieValue;
    }


    const csrftoken =
        getCookie("csrftoken");


    /* ========================================================
       DOM ELEMENTS
    ======================================================== */

    const chatBody =
        document.getElementById(
            "chatBody"
        );

    const messageInput =
        document.getElementById(
            "messageInput"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );

    const typingIndicator =
        document.getElementById(
            "typingIndicator"
        );

    const emotionDisplay =
        document.getElementById(
            "emotionDisplay"
        );

    const confidenceDisplay =
        document.getElementById(
            "confidenceDisplay"
        );

    const confidenceBar =
        document.getElementById(
            "confidenceBar"
        );

    const cameraVideo =
        document.getElementById(
            "cameraVideo"
        );

    const cameraCanvas =
        document.getElementById(
            "cameraCanvas"
        );

    const cameraStatus =
        document.getElementById(
            "cameraStatus"
        );


    /* ========================================================
       CURRENT EMOTION STATE
    ======================================================== */

    let currentEmotion = "Neutral";

    let currentConfidence = 0;


    /* ========================================================
       EMOTION EMOJI
    ======================================================== */

    function getEmotionEmoji(emotion) {

        const emojis = {

            "Angry": "😡",

            "Happy": "😊",

            "Neutral": "😐",

            "Sad": "😢",

            "Surprise": "😲"

        };

        return (
            emojis[emotion] || "😐"
        );

    }


    /* ========================================================
       ESCAPE HTML
    ======================================================== */

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent = text;

        return div.innerHTML;
    }


    /* ========================================================
       INLINE MARKDOWN
    ======================================================== */

    function renderInlineMarkdown(text) {

        let html =
            escapeHtml(text);


        /*
         * Bold
         */

        html = html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


        /*
         * Inline code
         */

        html = html.replace(
            /`([^`]+)`/g,
            '<code class="inline-code">$1</code>'
        );


        /*
         * Italic
         */

        html = html.replace(
            /(?<!\*)\*([^*]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


        return html;

    }


    /* ========================================================
       MARKDOWN + CODE RENDERER
    ======================================================== */

    function renderMarkdown(text) {

        if (!text) {

            return "";

        }


        /*
         * Normalize line endings
         */

        text =
            text.replace(
                /\r\n/g,
                "\n"
            );


        /*
         * Extract code blocks first
         */

        const codeBlocks = [];


        text =
            text.replace(
                /```(\w+)?\n?([\s\S]*?)```/g,
                function (
                    match,
                    language,
                    code
                ) {

                    const index =
                        codeBlocks.length;

                    codeBlocks.push({

                        language:
                            language ||
                            "code",

                        code:
                            code.trim()

                    });

                    return (
                        `___CODE_BLOCK_${index}___`
                    );

                }
            );


        /*
         * Split paragraphs
         */

        const lines =
            text.split("\n");

        let html = "";

        let inList = false;


        function closeList() {

            if (inList) {

                html += "</ul>";

                inList = false;

            }

        }


        for (
            let i = 0;
            i < lines.length;
            i++
        ) {

            const line =
                lines[i].trim();


            /*
             * Empty line
             */

            if (!line) {

                closeList();

                continue;

            }


            /*
             * Code block placeholder
             */

            const codeMatch =
                line.match(
                    /^___CODE_BLOCK_(\d+)___$/
                );


            if (codeMatch) {

                closeList();

                const index =
                    parseInt(
                        codeMatch[1]
                    );

                const block =
                    codeBlocks[index];

                const safeCode =
                    escapeHtml(
                        block.code
                    );


                html += `

                    <div class="code-wrapper">

                        <div class="code-header">

                            <span>
                                ${escapeHtml(
                                    block.language
                                )}
                            </span>

                            <button
                                class="copy-code-btn"
                                type="button"
                                data-code="${encodeURIComponent(
                                    block.code
                                )}"
                                onclick="copyCode(this)"
                            >
                                Copy
                            </button>

                        </div>

                        <pre><code>${safeCode}</code></pre>

                    </div>

                `;

                continue;

            }


            /*
             * H1
             */

            if (
                line.startsWith("# ")
            ) {

                closeList();

                html +=
                    `<h1>${renderInlineMarkdown(
                        line.substring(2)
                    )}</h1>`;

                continue;

            }


            /*
             * H2
             */

            if (
                line.startsWith("## ")
            ) {

                closeList();

                html +=
                    `<h2>${renderInlineMarkdown(
                        line.substring(3)
                    )}</h2>`;

                continue;

            }


            /*
             * H3
             */

            if (
                line.startsWith("### ")
            ) {

                closeList();

                html +=
                    `<h3>${renderInlineMarkdown(
                        line.substring(4)
                    )}</h3>`;

                continue;

            }


            /*
             * Bullet list
             */

            if (
                line.startsWith("- ") ||
                line.startsWith("* ")
            ) {

                if (!inList) {

                    html += "<ul>";

                    inList = true;

                }

                html +=
                    `<li>${renderInlineMarkdown(
                        line.substring(2)
                    )}</li>`;

                continue;

            }


            /*
             * Numbered list
             */

            const numbered =
                line.match(
                    /^\d+\.\s+(.*)$/
                );


            if (numbered) {

                closeList();

                html +=
                    `<p>${renderInlineMarkdown(
                        line
                    )}</p>`;

                continue;

            }


            /*
             * Normal paragraph
             */

            closeList();

            html +=
                `<p>${renderInlineMarkdown(
                    line
                )}</p>`;

        }


        closeList();


        return html;

    }


    /* ========================================================
       COPY CODE
    ======================================================== */

    async function copyCode(button) {

        try {

            const code =
                decodeURIComponent(
                    button.dataset.code
                );

            await navigator.clipboard.writeText(
                code
            );

            const oldText =
                button.textContent;

            button.textContent =
                "Copied!";

            setTimeout(
                function () {

                    button.textContent =
                        oldText;

                },
                1500
            );

        } catch (error) {

            console.error(
                "Copy failed:",
                error
            );

        }

    }


    /* ========================================================
       ADD MESSAGE
    ======================================================== */

    function addMessage(
        text,
        sender,
        source = null
    ) {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "message-row " +
            sender;


        const label =
            document.createElement(
                "div"
            );

        label.className =
            "message-label";

        label.textContent =
            sender === "user"
                ? "You"
                : "AI Assistant";


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "message-bubble";


        /*
         * USER MESSAGE
         */

        if (
            sender === "user"
        ) {

            bubble.textContent =
                text;

        }


        /*
         * BOT MESSAGE
         */

        else {

            bubble.innerHTML =
                renderMarkdown(
                    text
                );


            /*
             * Source badge
             */

            if (source) {

                const sourceBadge =
                    document.createElement(
                        "div"
                    );

                sourceBadge.className =
                    "response-source";


                if (
                    source === "llm"
                ) {

                    sourceBadge.textContent =
                        "✨ Gemini LLM";

                } else {

                    sourceBadge.textContent =
                        "🔄 Fallback";

                }


                bubble.appendChild(
                    sourceBadge
                );

            }

        }


        row.appendChild(label);

        row.appendChild(bubble);

        chatBody.appendChild(row);


        /*
         * Scroll to bottom
         */

        setTimeout(
            function () {

                chatBody.scrollTop =
                    chatBody.scrollHeight;

            },
            50
        );

    }


    /* ========================================================
       TYPING INDICATOR
    ======================================================== */

    function showTyping() {

        typingIndicator.style.display =
            "flex";

        chatBody.scrollTop =
            chatBody.scrollHeight;

    }


    function hideTyping() {

        typingIndicator.style.display =
            "none";

    }


    /* ========================================================
       UPDATE EMOTION UI
    ======================================================== */

    function updateEmotionUI(
        emotion,
        confidence
    ) {

        if (!emotion) {

            emotion =
                "Neutral";

        }


        currentEmotion =
            emotion;

        currentConfidence =
            parseFloat(
                confidence
            ) || 0;


        /*
         * Backend confidence is between
         * 0 and 1.
         */

        let percentage =
            currentConfidence * 100;


        percentage =
            Math.max(
                0,
                Math.min(
                    100,
                    percentage
                )
            );


        emotionDisplay.textContent =
            `${getEmotionEmoji(
                emotion
            )} ${emotion}`;


        confidenceDisplay.textContent =
            `${percentage.toFixed(
                1
            )}%`;


        confidenceBar.style.width =
            `${percentage}%`;

    }


    /* ========================================================
       CAMERA START
    ======================================================== */

    async function startCamera() {

        try {

            const stream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        video: true,
                        audio: false
                    }
                );


            cameraVideo.srcObject =
                stream;


            cameraStatus.textContent =
                "Active";


            cameraStatus.style.color =
                "#ffc107";


            /*
             * Start emotion detection
             */

            setTimeout(
                detectEmotion,
                1000
            );

        } catch (error) {

            console.error(
                "Camera error:",
                error
            );


            cameraStatus.textContent =
                "Unavailable";


            cameraStatus.style.color =
                "#ef4056";

        }

    }


    /* ========================================================
       DETECT EMOTION
    ======================================================== */

    async function detectEmotion() {

        if (
            !cameraVideo.videoWidth ||
            !cameraVideo.videoHeight
        ) {

            setTimeout(
                detectEmotion,
                1000
            );

            return;

        }


        try {

            const width =
                cameraVideo.videoWidth;

            const height =
                cameraVideo.videoHeight;


            cameraCanvas.width =
                width;

            cameraCanvas.height =
                height;


            const context =
                cameraCanvas.getContext(
                    "2d"
                );


            context.drawImage(
                cameraVideo,
                0,
                0,
                width,
                height
            );


            cameraCanvas.toBlob(
                async function (blob) {

                    if (!blob) {

                        return;

                    }


                    const formData =
                        new FormData();


                    formData.append(
                        "image",
                        blob,
                        "webcam.jpg"
                    );


                    const response =
                        await fetch(
                            "{% url 'detect_emotion' %}",
                            {
                                method: "POST",

                                headers: {
                                    "X-CSRFToken":
                                        csrftoken
                                },

                                body:
                                    formData
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        data.success &&
                        data.face_detected
                    ) {

                        updateEmotionUI(
                            data.emotion,
                            data.confidence
                        );

                    } else {

                        updateEmotionUI(
                            "Neutral",
                            0
                        );

                    }

                },
                "image/jpeg",
                0.75
            );


        } catch (error) {

            console.error(
                "Emotion detection error:",
                error
            );

        }


        /*
         * Run every 1 second
         */

        setTimeout(
            detectEmotion,
            1000
        );

    }


    /* ========================================================
       SEND MESSAGE
    ======================================================== */

    async function sendMessage() {

        const message =
            messageInput.value.trim();


        if (!message) {

            return;

        }


        /*
         * Disable button
         */

        sendButton.disabled =
            true;


        /*
         * Show user message
         */

        addMessage(
            message,
            "user"
        );


        /*
         * Clear input
         */

        messageInput.value =
            "";


        /*
         * Show typing
         */

        showTyping();


        try {

            const formData =
                new FormData();


            formData.append(
                "message",
                message
            );


            formData.append(
                "emotion",
                currentEmotion
            );


            formData.append(
                "confidence",
                currentConfidence
            );


            const response =
                await fetch(
                    "{% url 'chat_api' %}",
                    {
                        method: "POST",

                        headers: {
                            "X-CSRFToken":
                                csrftoken
                        },

                        body:
                            formData
                    }
                );


            const data =
                await response.json();


            hideTyping();


            if (
                data.success
            ) {

                addMessage(
                    data.response,
                    "bot",
                    data.source
                );

            } else {

                addMessage(
                    "Sorry, something went wrong. Please try again.",
                    "bot",
                    "fallback"
                );

            }


        } catch (error) {

            console.error(
                "Chat error:",
                error
            );


            hideTyping();


            addMessage(
                "Unable to connect to the chatbot right now. Please try again.",
                "bot",
                "fallback"
            );


        } finally {

            sendButton.disabled =
                false;

            messageInput.focus();

        }

    }


    /* ========================================================
       SEND BUTTON
    ======================================================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* ========================================================
       ENTER KEY
    ======================================================== */

    messageInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* ========================================================
       START CAMERA WHEN PAGE LOADS
    ======================================================== */

    window.addEventListener(
        "load",
        function () {

            startCamera();

            messageInput.focus();

        }
    );


    /* ========================================================
       STOP CAMERA WHEN PAGE IS CLOSED
    ======================================================== */

    window.addEventListener(
        "beforeunload",
        function () {

            const stream =
                cameraVideo.srcObject;


            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        function (track) {

                            track.stop();

                        }
                    );

            }

        }
    );

</script>


</body>
